name: KPGS Projection Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "tests/test_kpgs_sync_projection.py"
      - ".github/workflows/kpgs-projection-proof.yml"
  push:
    branches:
      - "agent/starfall-kpgs-*"
    paths:
      - "apps/api/**"
      - "tests/test_kpgs_sync_projection.py"
      - ".github/workflows/kpgs-projection-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starfall-kpgs-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Compile · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements.txt

      - name: Compile API and tests
        run: python -m compileall -q apps/api tests/test_kpgs_sync_projection.py

      - name: Run KPGS projection tests
        run: python -m unittest -v tests.test_kpgs_sync_projection
